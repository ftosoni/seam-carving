name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config Release

    # Unit tests (tests/tests.cpp) and command-line tests of every program
    # option, energy function and error case (tests/cli_tests.cmake).
    - name: Run Tests
      working-directory: build
      run: ctest -C Release --output-on-failure
